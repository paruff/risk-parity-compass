name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekday evenings (UTC, after the US close): rebuild with a fresh price snapshot.
  schedule:
    - cron: '17 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Best effort: Yahoo may rate-limit CI runners. On failure the committed snapshot is used.
      - name: Refresh price snapshot
        run: npm run prices:update
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages
        run: |
          gh api repos/{owner}/{repo}/pages -f build_type=workflow 2>/dev/null || \
          echo "::warning::GitHub Pages may not be enabled. Enable it at https://github.com/${{ github.repository }}/settings/pages"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: deployment
        uses: actions/deploy-pages@v5

  # Runs the full e2e suite against the site that was just published, so a broken deploy
  # (bad base path, missing asset, CSP violation) fails the workflow instead of going unnoticed.
  # The main suite mocks price files; the step after it requires real snapshot data on the live site.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E against the live site
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          # page_url ends with the repo path; the specs navigate with absolute paths.
          export BASE_URL="$(echo "$BASE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
          echo "Verifying $BASE_URL"
          npm run test:e2e
      - name: Live site can price real tickers (no mocks)
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          REQUIRE_REAL_PRICES: '1'
        run: |
          export BASE_URL="$(echo "$BASE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
          npx playwright test tests/e2e/real-prices.spec.js
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-live-results
          path: test-results/
