name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages
        run: |
          gh api repos/{owner}/{repo}/pages -f build_type=workflow 2>/dev/null || \
          echo "::warning::GitHub Pages may not be enabled. Enable it at https://github.com/${{ github.repository }}/settings/pages"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs the full e2e suite against the site that was just published, so a broken deploy
  # (bad base path, missing asset, CSP violation) fails the workflow instead of going unnoticed.
  # Yahoo is mocked inside the specs, so this verifies the deployed build, not live prices.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E against the live site
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          # page_url ends with the repo path; the specs navigate with absolute paths.
          export BASE_URL="$(echo "$BASE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
          echo "Verifying $BASE_URL"
          npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-results
          path: test-results/
