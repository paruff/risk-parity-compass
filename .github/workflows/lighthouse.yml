name: Lighthouse CI
on: [push, pull_request]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Not a project dependency: its Puppeteer chain carries unfixable advisories (extract-zip).
      # Pinned and run only on the ephemeral CI runner.
      - run: npx --yes @lhci/cli@0.15.1 autorun
